<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Localisation en Temps Réel</title>

    <!-- 1. Inclusion de Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

    <style>
        /* Définition de la taille du conteneur de la carte */
        #map {
            height: 100vh; /* Prend toute la hauteur de la vue */
            width: 100%;
        }
    </style>
</head>
<body>

    <!-- Conteneur où la carte sera affichée -->
    <div id="map"></div>

    <!-- 2. Inclusion de Leaflet JavaScript -->
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <script>
        // Variables globales pour stocker la position centrale
        let userPosition = null;
        let map = null;

        // URL des tuiles OSM (Par défaut)
        const OSM_URL = 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png';
        // URL des tuiles Satellite (Option recommandée)
        const SATELLITE_URL = 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{x}/{y}';


        // Fonction pour initialiser la carte
        function initializeMap(lat, lon, tileLayer) {
            // Initialisation de la carte centrée sur la position de l'utilisateur
            map = L.map('map').setView([lat, lon], 16); // Zoom initial à 16

            // Ajout de la couche de tuiles choisie (OSM ou Satellite)
            L.tileLayer(tileLayer, {
                attribution: '© OpenStreetMap contributors' // Attribution ajustée
            }).addTo(map);

            // Affichage de la position actuelle de l'utilisateur
            L.marker([lat, lon]).addTo(map)
                .bindPopup("<b>Votre Position Actuelle</b><br>Lat: " + lat.toFixed(4) + ", Lon: " + lon.toFixed(4))
                .openPopup();

            userPosition = { lat: lat, lon: lon };
            generateRandomPoints(lat, lon);
        }

        // Fonction pour générer des points aléatoires
        function generateRandomPoints(centerLat, centerLon) {
            const points = [];
            const radiusMeters = 50;
            const numPoints = 3;

            for (let i = 0; i < numPoints; i++) {
                // Générer un angle aléatoire entre 0 et 2*PI
                const angle = Math.random() * 2 * Math.PI;
                // Générer une distance aléatoire dans le rayon
                const distance = Math.random() * radiusMeters;

                // Calculer la nouvelle latitude et longitude (en utilisant la trigonométrie sphérique)
                const newLat = centerLat + (distance / 100000) * Math.cos(angle);
                const newLon = centerLon + (distance / 100000) * Math.sin(angle);

                points.push({ lat: newLat, lon: newLon });
            }

            // Ajouter les marqueurs sur la carte
            points.forEach(point => {
                L.circleMarker([point.lat, point.lon], {
                    radius: 5, // Taille du rond
                    color: 'red', // Couleur rouge
                    fillColor: '#f03',
                    fillOpacity: 0.8,
                    weight: 1
                }).addTo(map)
                .bindPopup(`Point aléatoire #${points.indexOf(point) + 1}`);
            });
        }

        // Fonction principale de géolocalisation
        function getLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        
                        // *** DÉCISION CLÉ : Choisir la couche de tuiles ***
                        // Ici, nous utilisons la couche satellite.
                        initializeMap(lat, lon, SATELLITE_URL);
                    },
                    (error) => {
                        alert("Erreur de géolocalisation : Veuillez autoriser l'accès à votre position.");
                        console.error("Geolocation error:", error);
                        // En cas d'échec, on peut revenir à l'OSM par sécurité
                        initializeMap(error.coords.latitude, error.coords.longitude, OSM_URL);
                    },
                    {
                        enableHighAccuracy: true,
                        timeout: 10000, // Augmentation du timeout pour être plus patient
                        maximumAge: 0
                    }
                );
            } else {
                alert("Votre navigateur ne supporte pas la géolocalisation.");
            }
        }

        // Lancement de la fonction au chargement de la page
        getLocation();

    </script>
</body>
</html>
