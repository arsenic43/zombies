<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ma position en temps réel</title>

  <!-- Leaflet (CSS + JS) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin=""/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          crossorigin=""></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }
    #map {
      width: 100%;
      height: 100%;
    }
    /* Message d'information / d'erreur */
    #message {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 1000;
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 16px 24px;
      font-family: sans-serif;
      font-size: 14px;
      max-width: 320px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }
    #message.hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="message">En attente de votre position…<br>Veuillez autoriser la géolocalisation.</div>

  <script>
    "use strict";

    const ZOOM_MAX = 19;             // Zoom maximum pour les tuiles OpenStreetMap
    const RAYON_METRES = 50;         // Rayon des points aléatoires
    const NB_POINTS = 3;             // Nombre de points à afficher
    const INTERVALLE_MS = 1000;      // Actualisation toutes les secondes
    const VITESSE_MS = 5 / 3.6;      // Vitesse des points : 5 km/h ≈ 1,39 m/s

    // --- Initialisation de la carte (centrée arbitrairement en attendant le GPS) ---
    const map = L.map("map", {
      zoomControl: false,   // Aucun autre contrôle demandé
      maxZoom: ZOOM_MAX
    }).setView([46.603354, 1.888334], ZOOM_MAX); // Centré sur la France par défaut

    // --- Fonds de carte ---
    const coucheOSM = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: ZOOM_MAX,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    });

    const coucheSatellite = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {
      maxZoom: ZOOM_MAX,
      attribution: "Imagery &copy; Esri, Maxar, Earthstar Geographics"
    });

    coucheOSM.addTo(map); // Vue par défaut

    // --- Sélecteur de fond de carte en haut à droite ---
    L.control.layers(
      { "Par défaut": coucheOSM, "Satellite": coucheSatellite },
      null,
      { position: "topright", collapsed: false }
    ).addTo(map);

    // --- État de l'application ---
    let carteInitialisee = false;    // Premier centrage sur la position GPS déjà fait ?
    let marqueurPosition = null;     // Rond bleu = ma position
    let cercleRayon = null;          // Cercle rouge en pointillés = rayon de 50 m
    let pointsRouges = [];           // Les 3 points rouges {marker, lat, lng}
    let dernierePosition = null;     // Dernière position reçue du navigateur

    // Cache des polygones "obstacles" (bâtiments + eau) autour de ma position
    let polygonesObstacles = [];     // [{ {lat, lon}, ... }, ...]
    let centreGeometrie = null;      // Position pour laquelle le cache est valable
    let geometrieDisponible = false; // Surcharge chargée avec succès ?

    /**
     * Distance en mètres entre deux points (lat/lng).
     */
    function distanceMetres(lat1, lng1, lat2, lng2) {
      const R = 6371000;
      const p1 = lat1 * Math.PI / 180;
      const p2 = lat2 * Math.PI / 180;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLng = (lng2 - lng1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) ** 2 +
                Math.cos(p1) * Math.cos(p2) * Math.sin(dLng / 2) ** 2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    /**
     * Génère un point aléatoire (distribution uniforme) dans un disque
     * de `rayon` mètres autour de (lat, lng).
     */
    function pointAleatoire(lat, lng, rayon) {
      const angle = Math.random() * 2 * Math.PI;
      const distance = rayon * Math.sqrt(Math.random());
      const dLat = (distance * Math.sin(angle)) / 111320;                            // ~111 320 m par degré de latitude
      const dLng = (distance * Math.cos(angle)) / (111320 * Math.cos(lat * Math.PI / 180));
      return { lat: lat + dLat, lng: lng + dLng };
    }

    /**
     * Test d'inclusion d'un point dans un polygone (algorithme du lancer de rayon).
     */
    function pointDansPolygone(lat, lng, polygone) {
      let dansPolygone = false;
      for (let i = 0, j = polygone.length - 1; i < polygone.length; j = i++) {
        const latI = polygone[i].lat, lngI = polygone[i].lon;
        const latJ = polygone[j].lat, lngJ = polygone[j].lon;
        if ((latI > lat) !== (latJ > lat) &&
            lng < (lngJ - lngI) * (lat - latI) / (latJ - latI) + lngI) {
          dansPolygone = !dansPolygone;
        }
      }
      return dansPolygone;
    }

    /**
     * Le point est-il sur un bâtiment ou un plan d'eau (d'après le cache OSM) ?
     */
    function estSurObstacle(lat, lng) {
      if (!geometrieDisponible) return false; // Pas de données : on ne peut pas tester
      return polygonesObstacles.some(p => pointDansPolygone(lat, lng, p));
    }

    /**
     * Recherche un point aléatoire hors bâtiments et hors eau.
     * Jusqu'à 20 tentatives ; en dernier recours, on garde la dernière proposition.
     */
    function pointLibreAleatoire(lat, lng) {
      let proposition = pointAleatoire(lat, lng, RAYON_METRES);
      for (let essai = 0; essai < 20; essai++) {
        proposition = pointAleatoire(lat, lng, RAYON_METRES);
        if (!estSurObstacle(proposition.lat, proposition.lng)) break;
      }
      return proposition;
    }

    /**
     * Charge les polygones des bâtiments et de l'eau dans un rayon de 100 m
     * autour de la position (API Overpass d'OpenStreetMap).
     * Le cache est rafraîchi seulement si l'on s'est déplacé de plus de 25 m.
     */
    async function majSurcharge(lat, lng) {
      if (centreGeometrie &&
          distanceMetres(centreGeometrie.lat, centreGeometrie.lng, lat, lng) < 25) {
        return; // Cache encore valable
      }

      const requete = "[out:json][timeout:15];(" +
        'way["building"](around:100,' + lat + "," + lng + ");" +
        'way["natural"="water"](around:100,' + lat + "," + lng + ");" +
        'way["waterway"="riverbank"](around:100,' + lat + "," + lng + ");" +
        ");out geom;";

      try {
        const reponse = await fetch("https://overpass-api.de/api/interpreter", {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: "data=" + encodeURIComponent(requete)
        });
        const donnees = await reponse.json();
        polygonesObstacles = (donnees.elements || [])
          .filter(e => e.geometry && e.geometry.length > 2)
          .map(e => e.geometry);
        centreGeometrie = { lat: lat, lng: lng };
        geometrieDisponible = true;
      } catch (erreur) {
        // Overpass indisponible : les points resteront aléatoires "simples"
        console.warn("Impossible de charger la surcharge OSM :", erreur);
        geometrieDisponible = false;
        polygonesObstacles = [];
      }
    }

    /**
     * Crée les 3 points rouges une première fois (hors obstacles).
     */
    async function creerPoints(lat, lng) {
      await majSurcharge(lat, lng);
      for (let i = 0; i < NB_POINTS; i++) {
        const p = pointLibreAleatoire(lat, lng);
        const marker = L.circleMarker([p.lat, p.lng], {
          radius: 8,
          color: "#cc0000",
          weight: 2,
          fillColor: "#ff0000",
          fillOpacity: 1
        }).addTo(map);
        marker.bindTooltip("Point " + (i + 1));
        pointsRouges.push({ marker: marker, lat: p.lat, lng: p.lng });
      }
    }

    /**
     * Déplace un point vers la position à la vitesse de 5 km/h.
     * Si le point atteint la position, il est replacé aléatoirement (hors obstacles).
     * Si le nouveau point tombe sur un bâtiment ou de l'eau, il ne bouge pas ce tour.
     */
    async function avancerPoint(point, lat, lng) {
      const distance = distanceMetres(point.lat, point.lng, lat, lng);
      const avance = VITESSE_MS * (INTERVALLE_MS / 1000); // Distance parcourue en 1 s

      if (distance <= avance) {
        // Le point a atteint ma position : nouvelle position aléatoire
        point.lat = lat;
        point.lng = lng;
        await majSurcharge(lat, lng);
        const p = pointLibreAleatoire(lat, lng);
        point.lat = p.lat;
        point.lng = p.lng;
      } else {
        const ratio = avance / distance;
        const nouveauLat = point.lat + (lat - point.lat) * ratio;
        const nouveauLng = point.lng + (lng - point.lng) * ratio;
        if (!estSurObstacle(nouveauLat, nouveauLng)) {
          point.lat = nouveauLat;
          point.lng = nouveauLng;
        }
        // Sinon : obstacle sur la trajectoire, le point attend ce tour
      }

      point.marker.setLatLng([point.lat, point.lng]);
    }

    /**
     * Mise à jour de l'affichage, appelée toutes les secondes.
     */
    async function actualiserTout() {
      if (!dernierePosition) return;

      const lat = dernierePosition.coords.latitude;
      const lng = dernierePosition.coords.longitude;

      document.getElementById("message").classList.add("hidden");

      // Première réception de la position : zoom maximum, centré sur moi
      if (!carteInitialisee) {
        carteInitialisee = true;
        map.setView([lat, lng], ZOOM_MAX);
        await creerPoints(lat, lng);
      } else {
        map.setView([lat, lng]);
      }

      // Marqueur de position (rond bleu)
      if (marqueurPosition) {
        marqueurPosition.setLatLng([lat, lng]);
      } else {
        marqueurPosition = L.circleMarker([lat, lng], {
          radius: 8,
          color: "#ffffff",
          weight: 2,
          fillColor: "#2a81cb",
          fillOpacity: 1
        }).addTo(map);
      }

      // Cercle du rayon de 50 m (visualisation)
      if (cercleRayon) {
        cercleRayon.setLatLng([lat, lng]);
      } else {
        cercleRayon = L.circle([lat, lng], {
          radius: RAYON_METRES,
          color: "#cc0000",
          weight: 1,
          fill: false,
          dashArray: "4 4"
        }).addTo(map);
      }

      // Les 3 points avancent vers ma position à 5 km/h
      for (const point of pointsRouges) {
        await avancerPoint(point, lat, lng);
      }
    }

    /**
     * Gestion des erreurs de géolocalisation.
     */
    function erreurGeoloc(erreur) {
      const messages = {
        1: "Géolocalisation refusée. Veuillez l'autoriser dans votre navigateur.",
        2: "Position indisponible. Réessayez plus tard.",
        3: "Délai dépassé pour obtenir la position."
      };
      document.getElementById("message").classList.remove("hidden");
      document.getElementById("message").innerHTML =
        "<strong>Erreur :</strong><br>" + (messages[erreur.code] || erreur.message);
    }

    // --- Suivi GPS : on garde la dernière position, l'affichage est actualisé chaque seconde ---
    if ("geolocation" in navigator) {
      navigator.geolocation.watchPosition(
        position => { dernierePosition = position; },
        erreurGeoloc,
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
      );
      setInterval(actualiserTout, INTERVALLE_MS);
    } else {
      document.getElementById("message").innerHTML =
        "<strong>Erreur :</strong><br>Votre navigateur ne prend pas en charge la géolocalisation.";
    }
  </script>
</body>
</html>
